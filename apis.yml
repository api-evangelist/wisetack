aid: wisetack
name: Wisetack
description: 'Wisetack is an embedded consumer financing (pay-over-time) platform for
  real-world services. Home service, auto repair, dental, medical, and veterinary
  businesses offer customers monthly payment options delivered via text or link, with
  approval in minutes; financing is provided through Wisetack''s lending partners.
  Wisetack embeds into 50+ vertical SaaS and field service management platforms
  (Housecall Pro, Jobber, JobNimbus, Thryv, Square) through a partner REST API with
  webhook reporting. Backed by Greylock and Insight Partners; SOC 2 Type 2 certified.'
